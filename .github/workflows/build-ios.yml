name: Build SFTA iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          uname -m

      - name: Check uploaded files
        run: |
          ls -lah
          test -f project.binary
          echo "project.binary found"

      - name: Create iOS project
        run: |
          mkdir -p build/SFTA
          cp project.binary build/SFTA/project.binary
          echo "SFTA files prepared"
