name: Build SFTA iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          python3 --version

      - name: Check uploaded files
        run: |
          ls -lh project.binary
          file project.binary

      - name: Download Godot 3.5.3 source
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/archive/refs/tags/3.5.3-stable.zip
          unzip -q godot.zip
          mv godot-3.5.3-stable godot

      - name: Install build tools
        run: |
          brew install scons

      - name: Build Godot for iOS
        working-directory: godot
        run: |
          scons platform=iphone target=release tools=no -j2

      - name: Prepare SFTA project
        run: |
          mkdir -p sfta
          cp project.binary sfta/project.binary

      - name: Show result
        run: |
          find godot/bin -maxdepth 1 -type f -print
          ls -lh sfta
