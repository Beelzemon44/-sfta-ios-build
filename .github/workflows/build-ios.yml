name: Build SFTA iOS

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "SFTA Google Drive file ID"
        required: true
        type: string

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Godot 3.2.3 source
        run: |
          git clone --depth 1 --branch 3.2.3-stable https://github.com/godotengine/godot.git godot

      - name: Patch old libpng for modern Xcode
        run: |
          sed -i '' '/# *include <fp.h>/d' godot/thirdparty/libpng/pngpriv.h
          sed -i '' '1i\
          #include <math.h>
          ' godot/thirdparty/libpng/png.c
          sed -i '' '1i\
          #include <math.h>
          ' godot/thirdparty/libpng/pngrtran.c
          sed -i '' '/define fdopen(fd,mode) NULL/d' godot/thirdparty/zlib/zutil.h
          grep -RIl '\bByte\b' godot/thirdparty/freetype/src/gzip | xargs sed -i '' '1i\
          typedef unsigned char Byte;
          '
      - name: Install SCons
        run: |
          brew install python@3.11
          python3.11 -m pip install scons==4.5.2 setuptools
        

      - name: Build Godot for iOS
        run: |
          cd godot
          set -o pipefail
          scons platform=iphone target=release arch=arm64 CCFLAGS="-Wno-module-import-in-extern-c" 2>&1 | tee build.log || true
          echo "===== FIRST REAL COMPILER ERROR ====="
          grep -n -m 1 -B 5 -A 15 -E ":[0-9]+:[0-9]+: error:" build.log || true
          echo "====================================="
      - name: Show final Godot build error
        run: |
          grep -n -i -E "error:|fatal error:|scons:.*Error" godot/build.log | tail -30 || true
      - name: Download SFTA v0.16
        run: |
          python3 -m pip install --user --break-system-packages --quiet gdown
          python3 -m gdown "${{ inputs.drive_file_id }}" -O SFTA_v0.16.zip
          ls -lh SFTA_v0.16.zip

      - name: Extract SFTA
        run: |
          mkdir -p sfta
          unzip -q SFTA_v0.16.zip -d sfta
          echo "===== SFTA EXTRACTED ====="
          du -sh sfta
          find sfta -maxdepth 2 -type f | head -50
      - name: Show SFTA contents
        run: |
          echo "===== SFTA CONTENTS ====="
          find sfta -maxdepth 4 -type f | head -200
      - name: Find SFTA project root
        run: |
          echo "===== PROJECT CANDIDATES ====="
          find sfta -type f \( -name "project.godot" -o -name "engine.cfg" -o -name "*.godot" \) -print
      - name: Inspect SFTA package
        run: |
          echo "===== ROOT ====="
          find sfta -maxdepth 2 -type f -print | head -100
          echo "===== PACKAGES ====="
          find sfta -type f \( -name "*.pck" -o -name "*.zip" -o -name "*.apk" -o -name "*.exe" -o -name "*.dylib" -o -name "*.so" \) -print
          echo "===== IMPORTANT FILES ====="
          find sfta -type f \( -name "*.cfg" -o -name "*.json" -o -name "*.import" \) -print | head -100
       
      - name: Prepare SFTA iOS data
        run: |
          set -e

          mkdir -p ios-build/sfta

          # Copy the exported Godot game data from the Android package.
          cp -R sfta/assets/. ios-build/sfta/

          echo "===== SFTA IOS DATA ====="
          ls -lh ios-build/sfta/project.binary
          test -f ios-build/sfta/project.binary
          test -f ios-build/sfta/scenes/mainMenu.tscn

          echo "SFTA data prepared successfully"
      - name: Find Godot iOS templates
        run: |
          echo "===== IOS TEMPLATE FILES ====="
          find godot -type f \( -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "*.plist" -o -name "*.zip" -o -name "*.cpp" \) | grep -Ei "iphone|ios|xcode|export" | head -200
      - name: Create iOS project
        run: |
          set -e

          TEMPLATE=$(find godot -type d -name "*.xcodeproj" -print -quit)

          echo "===== XCODE PROJECT ====="
          echo "$TEMPLATE"

          if [ -z "$TEMPLATE" ]; then
            echo "No Xcode project found"
            exit 1
          fi

          TEMPLATE_DIR=$(dirname "$TEMPLATE")
          echo "===== TEMPLATE DIRECTORY ====="
          echo "$TEMPLATE_DIR"
          find "$TEMPLATE_DIR" -maxdepth 2 -type f | head -100
      - name: Assemble SFTA iOS project
        run: |
          set -e

          TEMPLATE_DIR="godot/misc/dist/ios_xcode"

          mkdir -p ios-build/project
          cp -R "$TEMPLATE_DIR"/. ios-build/project/

          cp ios-build/sfta/project.binary ios-build/project/data.pck

          echo "===== FINAL IOS PROJECT ====="
          ls -lh ios-build/project
          test -f ios-build/project/godot_ios.xcodeproj/project.pbxproj
          test -f ios-build/project/data.pck

          echo "SFTA iOS project assembled successfully"
          echo "===== PBXPROJ FIRST 10 LINES ====="
          sed -n '1,10p' ios-build/project/godot_ios.xcodeproj/project.pbxproj
          echo "===== END PBXPROJ ====="
          echo "===== XCODE PROJECT CHECK ====="
          xcodebuild -list -project ios-build/project/godot_ios.xcodeproj || true
          echo "===== END XCODE PROJECT CHECK ====="
      - name: Build unsigned SFTA IPA
        run: |
          set -euo pipefail

          cd ios-build/project
          sed -i '' '1s|^// !$\*UTF8\*\$!$|// !$*UTF8*$!|' godot_ios.xcodeproj/project.pbxproj
          head -n 3 godot_ios.xcodeproj/project.pbxproj
          mv godot_ios SFTA
          mv SFTA/godot_ios-Info.plist SFTA/SFTA-Info.plist
          mv SFTA/godot_ios.entitlements SFTA/SFTA.entitlements

          cp libgodot.iphone.release.fat.a SFTA.a
          : > SFTA.pck

          python3 - <<'PY'
          from pathlib import Path

          pbx = Path("godot_ios.xcodeproj/project.pbxproj")
          text = pbx.read_text()

          replacements = {
              "$binary": "SFTA",
              "$name": "SFTA",
              "$identifier": "com.sfta.ios",
              "$team_id": "",
              "$godot_archs": "arm64",
              "$code_sign_identity_debug": "",
              "$code_sign_identity_release": "",
              "$provisioning_profile_uuid_debug": "",
              "$provisioning_profile_uuid_release": "",
              "$linker_flags": "",
              "$access_wifi": "0",
              "$game_center": "0",
              "$in_app_purchases": "0",
              "$push_notifications": "0",
              "$modules_buildfile": "",
              "$modules_fileref": "",
              "$modules_buildphase": "",
              "$modules_buildgrp": "",
              "$pbx_embeded_frameworks": "",
              "$pbx_launch_screen_build_reference": "",
              "$pbx_launch_screen_file_reference": "",
              "$pbx_launch_screen_copy_files": "",
              "$pbx_launch_screen_build_phase": "",
              "$pbx_launch_image_usage_setting": "",
              "$additional_pbx_files": "",
              "$additional_pbx_frameworks_build": "",
              "$additional_pbx_frameworks_refs": "",
              "$additional_pbx_resources_refs": "",
              "$additional_pbx_resources_build": "",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          pbx.write_text(text)

          plist = Path("SFTA/SFTA-Info.plist")
          text = plist.read_text()

          replacements = {
              "$name": "SFTA",
              "$binary": "SFTA",
              "$short_version": "0.16",
              "$signature": "SFTA",
              "$version": "16",
              "$docs_in_place": "<false/>",
              "$docs_sharing": "<false/>",
              "$required_device_capabilities": "<string>arm64</string>",
              "$camera_usage_description": "Camera access",
              "$photolibrary_usage_description": "Photo library access",
              "$microphone_usage_description": "Microphone access",
              "$interface_orientations": "<string>UIInterfaceOrientationPortrait</string>\n<string>UIInterfaceOrientationLandscapeLeft</string>\n<string>UIInterfaceOrientationLandscapeRight</string>",
              "$additional_plist_content": "<key>godot_path</key><string>sfta</string>",
              "$plist_launch_screen_name": "",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          plist.write_text(text)

          ent = Path("SFTA/SFTA.entitlements")
          ent.write_text(ent.read_text().replace("$entitlements_push_notifications", ""))
          PY
          echo "===== REMAINING PLACEHOLDERS ====="
          grep -n '\$[A-Za-z_][A-Za-z0-9_]*' godot_ios.xcodeproj/project.pbxproj || true

          echo "===== PBXPROJ CHECK ====="
          plutil -lint godot_ios.xcodeproj/project.pbxproj || true
          echo "===== PBXPROJ AROUND DYLIBS ====="
          grep -n -B 5 -A 15 "dylibs" godot_ios.xcodeproj/project.pbxproj || true
          echo "===== END DYLIBS ====="
          xcodebuild \
            -project godot_ios.xcodeproj \
            -target SFTA \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            CONFIGURATION_BUILD_DIR="$PWD/build"

          test -d build/SFTA.app

          cp -R ../sfta build/SFTA.app/sfta

          rm -rf Payload
          mkdir Payload
          cp -R build/SFTA.app Payload/SFTA.app

          rm -f ../SFTA-unsigned.ipa
          zip -qry ../SFTA-unsigned.ipa Payload

          ls -lh ../SFTA-unsigned.ipa

      - name: Upload SFTA IPA
        uses: actions/upload-artifact@v4
        with:
          name: SFTA-iOS
          path: ios-build/SFTA-unsigned.ipa
