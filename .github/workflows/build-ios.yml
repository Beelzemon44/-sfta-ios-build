name: Build SFTA iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Godot 3.2.3 source
        run: |
          git clone --depth 1 --branch 3.2.3-stable https://github.com/godotengine/godot.git godot

      - name: Patch old libpng for modern Xcode
        run: |
          sed -i '' '/# *include <fp.h>/d' godot/thirdparty/libpng/pngpriv.h
          sed -i '' '1i\
          #include <math.h>
          ' godot/thirdparty/libpng/png.c
          sed -i '' '1i\
          #include <math.h>
          ' godot/thirdparty/libpng/pngrtran.c
          sed -i '' '/define fdopen(fd,mode) NULL/d' godot/thirdparty/zlib/zutil.h
          grep -RIl '\bByte\b' godot/thirdparty/freetype/src/gzip | xargs sed -i '' '1i\
          typedef unsigned char Byte;
          '
      - name: Install SCons
        run: |
          brew install python@3.11
          python3.11 -m pip install scons==4.5.2 setuptools
        

      - name: Build Godot for iOS
        run: |
          cd godot
          set -o pipefail
          scons platform=iphone target=release arch=arm64 CCFLAGS="-Wno-module-import-in-extern-c" 2>&1 | tee build.log || true
          echo "===== FIRST REAL COMPILER ERROR ====="
          grep -n -m 1 -B 5 -A 15 -E ":[0-9]+:[0-9]+: error:" build.log || true
          echo "====================================="
      - name: Show final Godot build error
        run: |
          grep -n -i -E "error:|fatal error:|scons:.*Error" godot/build.log | tail -30 || true
