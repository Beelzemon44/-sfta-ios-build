name: Build SFTA iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show macOS and Xcode versions
        run: |
          sw_vers
          xcodebuild -version

      - name: Prepare folders
        run: |
          mkdir -p build
          mkdir -p sfta

      - name: Build environment check
        run: |
          echo "SFTA iOS build environment ready"
          echo "Godot target version: 3.4.3"
          uname -m
