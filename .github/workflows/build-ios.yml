name: Build SFTA iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Godot 3.2.3 source
        run: |
          git clone --depth 1 --branch 3.2.3-stable https://github.com/godotengine/godot.git godot

      - name: Patch old libpng for modern Xcode
        run: |
          sed -i '' '/# *include <fp.h>/d' godot/thirdparty/libpng/pngpriv.h
          printf '#include <math.h>\n' | cat - godot/thirdparty/libpng/png.c > /tmp/png.c && mv /tmp/png.c godot/thirdparty/libpng/png.c

      - name: Install SCons
        run: |
          brew install python@3.11
          python3.11 -m pip install scons==4.5.2 setuptools

      - name: Build Godot for iOS
        run: |
          cd godot
          set -o pipefail
          scons platform=iphone target=release arch=arm64 CCFLAGS="-Wno-error=module-import-in-extern-c" 2>&1 | tee build.log || {
            echo "========== COMPILER ERRORS =========="
            grep -n -i -B 5 -A 10 "error:" build.log || true
            echo "====================================="
            exit 1
          }

      - name: Prepare SFTA project
        run: |
          echo "Godot iOS build completed"
          ls -lah godot/bin
