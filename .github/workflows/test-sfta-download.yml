name: Test SFTA download

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Find real SFTA file links
        run: |
          set -e

          RESPONSE=$(curl -sS -L \
            -A "Mozilla/5.0" \
            -X POST \
            "https://gamingtalesstudio.itch.io/sfta-demo/download_url")

          URL=$(printf '%s' "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin)["url"])')

          curl -sS -L \
            -A "Mozilla/5.0" \
            "$URL" \
            -o page.html

          python3 <<'PY'
          import re

          html = open("page.html", encoding="utf-8", errors="ignore").read()

          m = re.search(r'id=["\'](game_download_[0-9]+)["\']', html)
          if not m:
              raise SystemExit("No game_download container found")

          target = m.group(1)
          pos = m.start()

          print("===== CURRENT ID =====")
          print(target)

          # Everything after the real SFTA download container,
          # but stop before unrelated recommendations/footer.
          block = html[pos:pos + 30000]

          terms = [
              "upload",
              "download",
              "android",
              ".apk",
              ".zip",
              "file",
              "MB",
              "GB",
          ]

          print("===== RELEVANT SFTA ENTRIES =====")

          results = []
          for term in terms:
              for hit in re.finditer(re.escape(term), block, re.I):
                  start = max(0, hit.start() - 250)
                  end = min(len(block), hit.end() + 450)
                  text = re.sub(r'\s+', ' ', block[start:end])

                  if text not in results:
                      results.append(text)

          for i, text in enumerate(results[:15], 1):
              print(f"\n--- {i} ---")
              print(text)

          print("\nTOTAL:", len(results))
          PY
