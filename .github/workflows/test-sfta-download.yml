name: Test SFTA download

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Ask itch.io for SFTA downloads
        run: |
          set -e

          curl -sS -L \
            -A "Mozilla/5.0" \
            -X POST \
            "https://gamingtalesstudio.itch.io/sfta-demo/download_url" \
            -o response.txt

          echo "===== RESPONSE SIZE ====="
          wc -c response.txt

          echo "===== DOWNLOAD INFO ====="
          grep -o -E '.{0,150}(Android|android|0\.16|upload_id|download|SFTA).{0,250}' response.txt | head -80 || true
