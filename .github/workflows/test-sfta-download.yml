name: Test SFTA download

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Find SFTA download entries
        run: |
          set -e

          RESPONSE=$(curl -sS -L \
            -A "Mozilla/5.0" \
            -X POST \
            "https://gamingtalesstudio.itch.io/sfta-demo/download_url")

          URL=$(printf '%s' "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin)["url"])')

          curl -sS -L \
            -A "Mozilla/5.0" \
            "$URL" \
            -o page.html

          python3 <<'PY'
          import re

          html = open("page.html", encoding="utf-8", errors="ignore").read()

          patterns = [
              r'.{0,250}upload_id.{0,400}',
              r'.{0,250}uploadId.{0,400}',
              r'.{0,250}download_btn.{0,500}',
              r'.{0,250}file_name.{0,400}',
              r'.{0,250}SFTA.{0,500}',
          ]

          print("===== SFTA DOWNLOAD CANDIDATES =====")

          found = []
          for pattern in patterns:
              for match in re.findall(pattern, html, re.I | re.S):
                  clean = re.sub(r'\s+', ' ', match)
                  if clean not in found:
                      found.append(clean)

          for i, item in enumerate(found[:20], 1):
              print(f"\n--- MATCH {i} ---")
              print(item[:900])

          print("\nTOTAL MATCHES:", len(found))
          PY
