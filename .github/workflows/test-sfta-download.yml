name: Test SFTA download

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check actual SFTA download
        run: |
          set -e

          RESPONSE=$(curl -sS -L \
            -A "Mozilla/5.0" \
            -X POST \
            "https://gamingtalesstudio.itch.io/sfta-demo/download_url")

          URL=$(printf '%s' "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin)["url"])')

          echo "Temporary URL received."
          echo "===== FINAL DOWNLOAD HEADERS ====="

          curl -sS -L \
            -A "Mozilla/5.0" \
            -r 0-0 \
            -D headers.txt \
            -o /dev/null \
            "$URL"

          grep -i -E "HTTP/|content-length|content-range|content-type|content-disposition" headers.txt || true
