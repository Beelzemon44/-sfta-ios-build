name: Test SFTA download

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect current SFTA download
        run: |
          set -e

          RESPONSE=$(curl -sS -L \
            -A "Mozilla/5.0" \
            -X POST \
            "https://gamingtalesstudio.itch.io/sfta-demo/download_url")

          URL=$(printf '%s' "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin)["url"])')

          curl -sS -L \
            -A "Mozilla/5.0" \
            "$URL" \
            -o page.html

          python3 <<'PY'
          import re

          html = open("page.html", encoding="utf-8", errors="ignore").read()

          matches = re.findall(r"game_download_[0-9]+", html)

          print("===== CURRENT DOWNLOAD IDS =====")
          print(sorted(set(matches)))

          if not matches:
              raise SystemExit("No game_download ID found")

          target = matches[0]
          pos = html.find(target)

          print("===== USING =====")
          print(target)

          start = max(0, pos - 4000)
          end = min(len(html), pos + 4000)

          block = html[start:end]
          block = re.sub(r'\s+', ' ', block)

          print("===== DOWNLOAD CONTAINER =====")
          print(block)
          PY
