name: Test SFTA download

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Extract SFTA download element
        run: |
          set -e

          RESPONSE=$(curl -sS -L \
            -A "Mozilla/5.0" \
            -X POST \
            "https://gamingtalesstudio.itch.io/sfta-demo/download_url")

          URL=$(printf '%s' "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin)["url"])')

          curl -sS -L \
            -A "Mozilla/5.0" \
            "$URL" \
            -o page.html

          python3 <<'PY'
          import re

          html = open("page.html", encoding="utf-8", errors="ignore").read()

          ids = re.findall(r'game_download_[0-9]+', html)
          if not ids:
              raise SystemExit("No game_download ID found")

          target = ids[0]

          print("===== CURRENT ID =====")
          print(target)

          patterns = [
              rf'<[^>]+id=["\']{re.escape(target)}["\'][^>]*>',
              rf'<[^>]+id=["\']{re.escape(target)}["\'][^>]*>.*?</[^>]+>',
          ]

          print("===== ELEMENT =====")

          found = False
          for pattern in patterns:
              m = re.search(pattern, html, re.I | re.S)
              if m:
                  text = re.sub(r'\s+', ' ', m.group(0))
                  print(text[:6000])
                  found = True
                  break

          if not found:
              print("Exact element not found.")
              pos = html.find(target)
              print(html[max(0,pos-1000):pos+2000])
          PY
