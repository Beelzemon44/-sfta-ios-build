name: Test SFTA download

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect SFTA download container
        run: |
          set -e

          RESPONSE=$(curl -sS -L \
            -A "Mozilla/5.0" \
            -X POST \
            "https://gamingtalesstudio.itch.io/sfta-demo/download_url")

          URL=$(printf '%s' "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin)["url"])')

          curl -sS -L \
            -A "Mozilla/5.0" \
            "$URL" \
            -o page.html

          python3 <<'PY'
          import re

          html = open("page.html", encoding="utf-8", errors="ignore").read()
          target = "game_download_5988589"

          pos = html.find(target)

          print("===== TARGET POSITION =====")
          print(pos)

          if pos == -1:
              raise SystemExit("SFTA download container not found")

          start = max(0, pos - 5000)
          end = min(len(html), pos + 5000)
          block = html[start:end]

          block = re.sub(r'\s+', ' ', block)

          print("===== SFTA CONTAINER =====")
          print(block)
          PY
