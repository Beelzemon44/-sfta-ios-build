name: Download full SFTA

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Download SFTA from Google Drive
        run: |
          set -e

          FILE_ID="1mMha9K5ddEUH-5LIcB1N0Tku0XXf6W8l"

          python3 -m pip install --quiet gdown

          echo "Downloading full SFTA archive..."
          gdown "$FILE_ID" -O SFTA_v0.16.zip

          echo
          echo "===== DOWNLOADED FILE ====="
          ls -lh SFTA_v0.16.zip

          echo
          echo "===== ZIP TEST ====="
          unzip -t SFTA_v0.16.zip > zip-test.txt

          tail -5 zip-test.txt

          echo
          echo "SFTA DOWNLOAD AND ZIP CHECK SUCCESSFUL"
