name: Test SFTA download

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: List all SFTA uploads
        run: |
          set -e

          RESPONSE=$(curl -sS -L \
            -A "Mozilla/5.0" \
            -X POST \
            "https://gamingtalesstudio.itch.io/sfta-demo/download_url")

          URL=$(printf '%s' "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin)["url"])')

          curl -sS -L \
            -A "Mozilla/5.0" \
            "$URL" \
            -o page.html

          python3 <<'PY'
          import re
          import html as htmlmod

          data = open("page.html", encoding="utf-8", errors="ignore").read()

          pattern = re.compile(
              r'data-upload_id=["\'](\d+)["\'].*?'
              r'class=["\']upload_name["\'].*?'
              r'<strong[^>]*class=["\']name["\'][^>]*>(.*?)</strong>.*?'
              r'class=["\']file_size["\'].*?<span>(.*?)</span>',
              re.I | re.S
          )

          matches = pattern.findall(data)

          print("======================================")
          print("          ALL SFTA UPLOADS")
          print("======================================")

          if not matches:
              raise SystemExit("No uploads found")

          for upload_id, name, size in matches:
              name = re.sub(r'<[^>]+>', '', name)
              size = re.sub(r'<[^>]+>', '', size)

              name = htmlmod.unescape(name).strip()
              size = htmlmod.unescape(size).strip()

              print()
              print("NAME:", name)
              print("SIZE:", size)
              print("UPLOAD ID:", upload_id)

          print()
          print("======================================")
          print("TOTAL:", len(matches))
          print("======================================")
          PY
