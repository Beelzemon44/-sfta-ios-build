name: Test SFTA download

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get Android download URL
        run: |
          set -e

          PAGE_RESPONSE=$(curl -sS -L \
            -A "Mozilla/5.0" \
            -X POST \
            "https://gamingtalesstudio.itch.io/sfta-demo/download_url")

          PAGE_URL=$(printf '%s' "$PAGE_RESPONSE" | python3 -c \
            'import sys,json; print(json.load(sys.stdin)["url"])')

          curl -sS -L \
            -A "Mozilla/5.0" \
            "$PAGE_URL" \
            -o page.html

          python3 <<'PY'
          import re

          data = open("page.html", encoding="utf-8", errors="ignore").read()

          upload_id = "17882920"

          print("======================================")
          print("ANDROID UPLOAD ID:", upload_id)
          print("======================================")

          pos = data.find('data-upload_id="' + upload_id + '"')

          if pos == -1:
              raise SystemExit("Android upload not found")

          start = max(0, pos - 500)
          end = min(len(data), pos + 2500)

          block = data[start:end]

          print(block)

          print()
          print("======================================")
          print("SEARCHING FOR DOWNLOAD PARAMETERS")
          print("======================================")

          for pattern in [
              r'https?[^"\']+',
              r'data-[^=]+=["\'][^"\']+["\']',
              r'upload_id[^,}<]+'
          ]:
              for match in re.findall(pattern, block, re.I):
                  print(match)
          PY
