name: Test SFTA download

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Find actual SFTA uploads
        run: |
          set -e

          RESPONSE=$(curl -sS -L \
            -A "Mozilla/5.0" \
            -X POST \
            "https://gamingtalesstudio.itch.io/sfta-demo/download_url")

          URL=$(printf '%s' "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin)["url"])')

          curl -sS -L \
            -A "Mozilla/5.0" \
            "$URL" \
            -o download-page.html

          echo "===== PAGE SIZE ====="
          wc -c download-page.html

          echo "===== POSSIBLE UPLOADS ====="
          grep -oiE '.{0,180}(android|apk|0\.16|upload|file_name|filename|2[.,]?[0-9]* ?GB).{0,300}' download-page.html \
            | head -100 || true
